<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Risol Snake with arum 🥟</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, sans-serif;
    background: #f3e7d2;
    color: #293629;
}

.hidden {
    display: none !important;
}


/* =========================
   SCREEN
========================= */

.screen {
    width: 100%;
    height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}


/* =========================
   HOME
========================= */

.home-card {
    width: min(90vw, 400px);

    background: #fffaf1;

    border: 3px solid #293629;
    border-radius: 25px;

    padding: 25px;

    text-align: center;

    box-shadow: 7px 7px 0 #293629;
}

.arum-photo {
    width: min(65vw, 240px);
    height: min(65vw, 240px);

    object-fit: cover;

    border-radius: 18px;

    border: 3px solid #293629;
}

.title {
    margin-top: 18px;

    font-size: clamp(30px, 8vw, 44px);

    font-weight: 900;

    letter-spacing: 2px;
}

.subtitle {
    margin: 6px 0 24px;

    color: #737b73;
}

button {
    border: 3px solid #293629;

    border-radius: 13px;

    background: #efbf68;

    color: #293629;

    font-size: 17px;

    font-weight: 900;

    padding: 12px 30px;

    box-shadow: 4px 4px 0 #293629;
}

button:active {
    transform: translate(3px, 3px);

    box-shadow: 1px 1px 0 #293629;
}


/* =========================
   GAME SCREEN
========================= */

.game-screen {
    flex-direction: column;

    justify-content: flex-start;

    padding-top: 15px;

    gap: 10px;
}

.top-bar {
    width: min(92vw, 500px);

    display: flex;

    justify-content: space-between;

    align-items: center;

    font-weight: 900;
}

.score {
    font-size: 25px;
}

.home-button {
    padding: 7px 13px;

    font-size: 20px;
}


/* =========================
   BOARD
========================= */

.game-board {
    width: min(92vw, 500px);

    aspect-ratio: 1 / 1;

    border: 4px solid #293629;

    border-radius: 12px;

    overflow: hidden;

    background: #ffffff;

    box-shadow: 6px 6px 0 #293629;

    touch-action: none;
}

canvas {
    display: block;

    width: 100%;
    height: 100%;
}

.hint {
    margin: 3px 0;

    color: #626b62;

    font-size: 13px;
}


/* =========================
   GAME OVER
========================= */

.game-over-card {
    width: min(90vw, 370px);

    background: #fffaf1;

    border: 3px solid #293629;

    border-radius: 25px;

    padding: 30px;

    text-align: center;

    box-shadow: 7px 7px 0 #293629;
}

.game-over-card h2 {
    font-size: 32px;

    margin: 10px 0;
}

.game-over-card p {
    color: #687168;

    margin-bottom: 22px;
}

.game-over-card button {
    width: 100%;

    margin-top: 10px;
}

.secondary {
    background: #eee2cf;
}

</style>
</head>


<body>


<!-- =========================
     HOME
========================= -->

<section
    id="homeScreen"
    class="screen"
>

    <div class="home-card">

        <img
            class="arum-photo"
            src="Untitled%20design_20260825_090032_0000.png"
            alt="Arum"
        >

        <div class="title">
            KASIH MAKAN ULAR
        </div>

        <p class="subtitle">
            Arum's little game 🥟
        </p>

        <button id="playButton">
            PLAY
        </button>

    </div>

</section>



<!-- =========================
     GAME
========================= -->

<section
    id="gameScreen"
    class="screen game-screen hidden"
>

    <div class="top-bar">

        <div>
            RISOL
            <span
                id="score"
                class="score"
            >0</span>
        </div>

        <button
            id="homeButton"
            class="home-button"
        >
            ⌂
        </button>

    </div>


    <div class="game-board">

        <canvas id="gameCanvas"></canvas>

    </div>


    <p class="hint">
        Swipe to move 🐍
    </p>

</section>



<!-- =========================
     GAME OVER
========================= -->

<section
    id="gameOverScreen"
    class="screen hidden"
>

    <div class="game-over-card">

        <div style="font-size:48px;">
            🥟
        </div>

        <h2>
            MAAF SELESAI!
        </h2>

        <p>
            You ate
            <strong id="finalScore">0</strong>
            risols!
        </p>

        <button id="againButton">
            COBAIN LAGI
        </button>

        <button
            id="backButton"
            class="secondary"
        >
            HOME
        </button>

    </div>

</section>



<script>

/* =========================
   ELEMENTS
========================= */

const homeScreen =
    document.getElementById("homeScreen");

const gameScreen =
    document.getElementById("gameScreen");

const gameOverScreen =
    document.getElementById("gameOverScreen");

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const scoreText =
    document.getElementById("score");

const finalScore =
    document.getElementById("finalScore");


/* =========================
   SETTINGS
========================= */

const GRID = 28;

/*
   Ular memenuhi satu kotak.
   Jadi tetap kelihatan walaupun
   grid-nya kecil seperti Snake jadul.
*/
const SNAKE_SIZE = 1.00;

/*
   Risol juga memenuhi satu kotak.
*/
const RISOL_SIZE = 1.00;


/* =========================
   RISOL FILES
========================= */

const risolFiles = [
    "Risol1.png",
    "Risol2.png",
    "Risol3.png"
];

const risolImages = risolFiles.map(
    file => {

        const img = new Image();

        img.src = file;

        return img;

    }
);


/* =========================
   GAME VARIABLES
========================= */

let cellSize = 1;

let snake = [];

let food = null;

let score = 0;

let timer = null;

let running = false;

let speed = 150;


let direction = {
    x: 1,
    y: 0
};

let nextDirection = {
    x: 1,
    y: 0
};


/* =========================
   CANVAS
========================= */

function resizeCanvas() {

    const size =
        Math.min(
            window.innerWidth * 0.92,
            500
        );

    canvas.width = size;
    canvas.height = size;

    cellSize =
        size / GRID;

    draw();
}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================
   START GAME
========================= */

function startGame() {

    alert("GAME START!");

    homeScreen.classList.add("hidden");

    gameOverScreen.classList.add("hidden");

    gameScreen.classList.remove("hidden");

    homeScreen.classList.add("hidden");

    gameOverScreen.classList.add("hidden");

    gameScreen.classList.remove("hidden");


    /*
       Ular mulai dengan
       3 bagian.

       Posisi di tengah.
    */

    snake = [
        {
            x: 14,
            y: 14
        },
        {
            x: 13,
            y: 14
        },
        {
            x: 12,
            y: 14
        }
    ];


    direction = {
        x: 1,
        y: 0
    };

    nextDirection = {
        x: 1,
        y: 0
    };


    score = 0;

    speed = 150;

    running = true;


    scoreText.textContent = "0";


    resizeCanvas();

    createFood();


    clearInterval(timer);

    timer = setInterval(
        updateGame,
        speed
    );


    draw();
}


/* =========================
   CREATE RISOL
========================= */

function createFood() {

    let newFood;


    do {

        newFood = {

            x:
                Math.floor(
                    Math.random() * GRID
                ),

            y:
                Math.floor(
                    Math.random() * GRID
                )

        };

    } while (

        snake.some(
            part =>
                part.x === newFood.x &&
                part.y === newFood.y
        )

    );


    /*
       Pilih random dari
       Risol1, Risol2, Risol3.
    */

    const randomImage =
        risolImages[
            Math.floor(
                Math.random() *
                risolImages.length
            )
        ];


    food = {

        x: newFood.x,

        y: newFood.y,

        image: randomImage

    };

}


/* =========================
   UPDATE
========================= */

function updateGame() {

    if (!running) return;


    direction =
        nextDirection;


    const head = {

        x:
            snake[0].x +
            direction.x,

        y:
            snake[0].y +
            direction.y

    };


    /* =====================
       WALL
    ===================== */

    if (

        head.x < 0 ||
        head.x >= GRID ||
        head.y < 0 ||
        head.y >= GRID

    ) {

        endGame();

        return;
    }


    /* =====================
       BODY
    ===================== */

    if (

        snake.some(
            part =>
                part.x === head.x &&
                part.y === head.y
        )

    ) {

        endGame();

        return;
    }


    /*
       Tambah kepala.
    */

    snake.unshift(head);


    /* =====================
       EAT RISOL
    ===================== */

    const ateFood =

        head.x === food.x &&
        head.y === food.y;


    if (ateFood) {

        score++;

        scoreText.textContent =
            score;


        /*
           Jangan pop ekor.

           Inilah yang membuat
           ular bertambah panjang.
        */

        createFood();


        /*
           Semakin panjang,
           semakin cepat.
        */

        speed =
            Math.max(
                65,
                150 - score * 4
            );


        clearInterval(timer);

        timer =
            setInterval(
                updateGame,
                speed
            );

    }

    else {

        /*
           Tidak makan:
           buang ekor.
        */

        snake.pop();

    }


    draw();
}


/* =========================
   DRAW
========================= */

function draw() {

    if (!canvas.width) return;


    /* =====================
       BACKGROUND
    ===================== */

    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* =====================
       GRID
    ===================== */

        "ctx.strokeStyle =
    "rgba(40,50,40,0.06)";

    ctx.lineWidth = 1;


    for (
        let i = 0;
        i <= GRID;
        i++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            i * cellSize,
            0
        );

        ctx.lineTo(
            i * cellSize,
            canvas.height
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            i * cellSize
        );

        ctx.lineTo(
            canvas.width,
            i * cellSize
        );

        ctx.stroke();

    }


    /* =====================
       RISOL
    ===================== */

    if (food) {

        const size =
            cellSize * RISOL_SIZE;

        const x =
            food.x * cellSize;

        const y =
            food.y * cellSize;


        if (
            food.image &&
            food.image.complete &&
            food.image.naturalWidth > 0
        ) {

            ctx.drawImage(
                food.image,
                x,
                y,
                size,
                size
            );

        }

        else {

            /*
               Fallback kalau PNG
               belum selesai loading.
            */

            ctx.font =
                `${cellSize * 0.9}px Arial`;

            ctx.textAlign =
                "center";

            ctx.textBaseline =
                "middle";

            ctx.fillText(
                "🥟",
                x + size / 2,
                y + size / 2
            );

        }

    }


    /* =====================
       SNAKE
    ===================== */

    for (
        let i = 0;
        i < snake.length;
        i++
    ) {

        const part =
            snake[i];

        const size =
            cellSize * SNAKE_SIZE;

        const x =
            part.x * cellSize;

        const y =
            part.y * cellSize;


        /*
           Kepala lebih gelap.
        */

        if (i === 0) {

            ctx.fillStyle =
                "#172b1b";

        }

        else {

            ctx.fillStyle =
                "#3f7048";

        }


        /*
           Badan ular.
        */

        ctx.fillRect(
            x,
            y,
            size,
            size
        );


        /*
           Garis tipis supaya
           setiap bagian tetap
           terlihat jelas.
        */

        ctx.strokeStyle =
            "#b8c68e";

        ctx.lineWidth = 1;

        ctx.strokeRect(
            x,
            y,
            size,
            size
        );


        /*
           Mata kepala.
        */

        if (i === 0) {

            drawEyes(
                x,
                y,
                size
            );

        }

    }

}


/* =========================
   EYES
========================= */

function drawEyes(
    x,
    y,
    size
) {

    ctx.fillStyle =
        "#ffffff";


    const eyeSize =
        Math.max(
            2,
            cellSize * 0.11
        );


    let eye1;
    let eye2;


    if (direction.x === 1) {

        eye1 = [
            x + size * 0.72,
            y + size * 0.28
        ];

        eye2 = [
            x + size * 0.72,
            y + size * 0.72
        ];

    }

    else if (direction.x === -1) {

        eye1 = [
            x + size * 0.28,
            y + size * 0.28
        ];

        eye2 = [
            x + size * 0.28,
            y + size * 0.72
        ];

    }

    else if (direction.y === -1) {

        eye1 = [
            x + size * 0.28,
            y + size * 0.28
        ];

        eye2 = [
            x + size * 0.72,
            y + size * 0.28
        ];

    }

    else {

        eye1 = [
            x + size * 0.28,
            y + size * 0.72
        ];

        eye2 = [
            x + size * 0.72,
            y + size * 0.72
        ];

    }


    ctx.beginPath();

    ctx.arc(
        eye1[0],
        eye1[1],
        eyeSize,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        eye2[0],
        eye2[1],
        eyeSize,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================
   GAME OVER
========================= */

function endGame() {

    running = false;

    clearInterval(timer);


    finalScore.textContent =
        score;


    gameScreen.classList.add(
        "hidden"
    );

    gameOverScreen.classList.remove(
        "hidden"
    );

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowUp" &&
            direction.y !== 1
        ) {

            nextDirection = {
                x: 0,
                y: -1
            };

        }

        else if (
            event.key === "ArrowDown" &&
            direction.y !== -1
        ) {

            nextDirection = {
                x: 0,
                y: 1
            };

        }

        else if (
            event.key === "ArrowLeft" &&
            direction.x !== 1
        ) {

            nextDirection = {
                x: -1,
                y: 0
            };

        }

        else if (
            event.key === "ArrowRight" &&
            direction.x !== -1
        ) {

            nextDirection = {
                x: 1,
                y: 0
            };

        }

    }
);


/* =========================
   MOBILE SWIPE
========================= */

let touchStartX = 0;
let touchStartY = 0;


canvas.addEventListener(
    "touchstart",
    function(event) {

        const touch =
            event.changedTouches[0];

        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;

    },
    {
        passive: true
    }
);


canvas.addEventListener(
    "touchend",
    function(event) {

        const touch =
            event.changedTouches[0];

        const dx =
            touch.clientX -
            touchStartX;

        const dy =
            touch.clientY -
            touchStartY;


        if (
            Math.max(
                Math.abs(dx),
                Math.abs(dy)
            ) < 20
        ) {
            return;
        }


        if (
            Math.abs(dx) >
            Math.abs(dy)
        ) {

            if (
                dx > 0 &&
                direction.x !== -1
            ) {

                nextDirection = {
                    x: 1,
                    y: 0
                };

            }

            else if (
                dx < 0 &&
                direction.x !== 1
            ) {

                nextDirection = {
                    x: -1,
                    y: 0
                };

            }

        }

        else {

            if (
                dy > 0 &&
                direction.y !== -1
            ) {

                nextDirection = {
                    x: 0,
                    y: 1
                };

            }

            else if (
                dy < 0 &&
                direction.y !== 1
            ) {

                nextDirection = {
                    x: 0,
                    y: -1
                };

            }

        }

    },
    {
        passive: true
    }
);


/* =========================
   BUTTONS
========================= */

document
    .getElementById("playButton")
    .addEventListener(
        "click",
        startGame
    );


document
    .getElementById("againButton")
    .addEventListener(
        "click",
        startGame
    );


document
    .getElementById("homeButton")
    .addEventListener(
        "click",
        function() {

            running = false;

            clearInterval(timer);

            gameScreen.classList.add(
                "hidden"
            );

            homeScreen.classList.remove(
                "hidden"
            );

        }
    );


document
    .getElementById("backButton")
    .addEventListener(
        "click",
        function() {

            gameOverScreen.classList.add(
                "hidden"
            );

            homeScreen.classList.remove(
                "hidden"
            );

        }
    );


/* =========================
   INITIALIZE
========================= */

resizeCanvas();

</script>

</body>
</html>
