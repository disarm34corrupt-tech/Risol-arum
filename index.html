* {

html,
body {

    height: 100%;

.hidden {

/* =========================
   SCREEN
========================= */

.screen {

    min-height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;

/* =========================
   HOME
========================= */

.home-card {

    width: min(92vw, 420px);

    background: #fffaf1;

    border: 3px solid #293629;
    border-radius: 25px;

    padding: 25px;

    padding: 15px;

.leaderboard-title {

    text-align: center;

    font-weight: 900;

    margin-bottom: 10px;
}

.leaderboard-row {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 6px 4px;

    border-bottom: 1px solid

.leaderboard-row:last-child {

    border-bottom: none;

.rank {

.player-name {

   GAME
========================= */

.game-screen {

    padding-top: 15px;

    gap: 10px;

}

.score {

    font-size: 25px;
}

.home-button {

    padding: 7px 13px;

}


/* =========================
   BOARD
========================= */

.game-board {

    width: min(92vw, 500px);

    aspect-ratio: 1 / 1;

    border: 4px solid #293629;

    border-radius: 12px;

    overflow: hidden;

    background: #ffffff;

    box-shadow: 6px 6px 0 #293629;

}

canvas {

    display: block;

    width: 100%;
    height: 100%;
}

.hint {

    margin: 3px 0;

    color: #626b62;

    font-size: 13px;
}


/* =========================
   GAME OVER
========================= */

.game-over-card {

    width: min(92vw, 420px);

    max-height: 90dvh;

    overflow-y: auto;

    background: #fffaf1;

    border: 3px solid #293629;

    text-align: center;

.game-over-card h2 {

}

.game-over-card p {

    margin-bottom: 18px;
}

.game-over-card button {

    width: 100%;

    margin-top: 10px;
}

.secondary {

    background: #eee2cf;
}


/* =========================
   NAME
========================= */

.name-text {

    font-size: 14px;

    color: #737b73;

    margin-top: 5px;
}


/* =========================
   LOADING
========================= */

.loading {

    text-align: center;

    color: #737b73;

    font-size: 13px;

    padding: 8px;
}

</style>

<!-- ==================================================
     FIREBASE + GAME
================================================== -->

<script type="module">


/* ==================================================
   FIREBASE IMPORT
================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getDatabase,
    ref,
    push,
    serverTimestamp,
    query,
    orderByChild,
    limitToLast,
    onValue
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* ==================================================
   FIREBASE CONFIG
================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAaed-Zfr6vNuSaMgUDrW0hQMogIIzqUpQ",

    authDomain:
        "risol-snake.firebaseapp.com",

    databaseURL:
        "https://risol-snake-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "risol-snake",

    storageBucket:
        "risol-snake.firebasestorage.app",

    messagingSenderId:
        "673579342765",

    appId:
        "1:673579342765:web:d3bdc52863034c4e371f24",

    measurementId:
        "G-FDPKTBJH7N"

};


/* ==================================================
   INITIALIZE FIREBASE
================================================== */

const app =
    initializeApp(firebaseConfig);


const database =
    getDatabase(app);


/* ==================================================
   ELEMENTS
================================================== */

const homeScreen =
    document.getElementById(
        "homeScreen"
    );

const gameScreen =
    document.getElementById(
        "gameScreen"
    );

const gameOverScreen =
    document.getElementById(
        "gameOverScreen"
    );

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");


const scoreText =
    document.getElementById(
        "score"
    );

const finalScore =
    document.getElementById(
        "finalScore"
    );


const homeLeaderboard =
    document.getElementById(
        "homeLeaderboard"
    );

const gameOverLeaderboard =
    document.getElementById(
        "gameOverLeaderboard"
    );


/* ==================================================
   SETTINGS
================================================== */

const GRID = 28;


/*
   Badan ular memenuhi
   kotak grid.
*/

const SNAKE_SIZE = 1.00;


/*
   Risol juga besar.
*/

const RISOL_SIZE = 1.00;


/* ==================================================
   RISOL FILES
================================================== */

const risolFiles = [

    "Risol1.png",

    "Risol2.png",

    "Risol3.png"

];


const risolImages =
    risolFiles.map(
        file => {

            const img =
                new Image();

            img.src = file;

            return img;

        }
    );


/* ==================================================
   GAME VARIABLES
================================================== */

let cellSize = 1;

let snake = [];

let food = null;

let score = 0;

let timer = null;

let running = false;

let speed = 150;

let playerName = "";


let direction = {

    x: 1,
    y: 0

};


let nextDirection = {

    x: 1,
    y: 0

};


/* ==================================================
   PLAYER NAME
================================================== */

function askPlayerName() {

    let name =
        prompt(
            "Masukkan nama kamu untuk leaderboard 🏆"
        );


    if (!name || !name.trim()) {

        name = "Anonymous";

    }


    name =
        name.trim()
            .substring(0, 20);


    playerName = name;

}


/* ==================================================
   CANVAS
================================================== */

function resizeCanvas() {

    const size =
        Math.min(
            window.innerWidth * 0.92,
            500
        );


    canvas.width =
        size;

    canvas.height =
        size;


    cellSize =
        size / GRID;


    draw();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* ==================================================
   START GAME
================================================== */

function startGame() {

    askPlayerName();


    homeScreen.classList.add(
        "hidden"
    );

    gameOverScreen.classList.add(
        "hidden"
    );

    gameScreen.classList.remove(
        "hidden"
    );


    snake = [

        {
            x: 14,
            y: 14
        },

        {
            x: 13,
            y: 14
        },

        {
            x: 12,
            y: 14
        }

    ];


    direction = {

        x: 1,
        y: 0

    };


    nextDirection = {

        x: 1,
        y: 0

    };


    score = 0;

    speed = 150;

    running = true;


    scoreText.textContent =
        "0";


    resizeCanvas();


    createFood();


    clearInterval(timer);


    timer =
        setInterval(
            updateGame,
            speed
        );


    draw();

}


/* ==================================================
   CREATE FOOD
================================================== */

function createFood() {

    let newFood;


    do {

        newFood = {

            x:
                Math.floor(
                    Math.random() *
                    GRID
                ),

            y:
                Math.floor(
                    Math.random() *
                    GRID
                )

        };

    }

    while (

        snake.some(
            part =>
                part.x === newFood.x &&
                part.y === newFood.y
        )

    );


    const randomImage =
        risolImages[
            Math.floor(
                Math.random() *
                risolImages.length
            )
        ];


    food = {

        x: newFood.x,

        y: newFood.y,

        image: randomImage

    };

}


/* ==================================================
   UPDATE GAME
================================================== */

function updateGame() {

    if (!running) return;


    direction =
        nextDirection;


    const head = {

        x:
            snake[0].x +
            direction.x,

        y:
            snake[0].y +
            direction.y

    };


    /* WALL */

    if (

        head.x < 0 ||
        head.x >= GRID ||
        head.y < 0 ||
        head.y >= GRID

    ) {

        endGame();

        return;

    }


    /* BODY */

    if (

        snake.some(
            part =>
                part.x === head.x &&
                part.y === head.y
        )

    ) {

        endGame();

        return;

    }


    snake.unshift(head);


    /* EAT */

    const ateFood =

        head.x === food.x &&
        head.y === food.y;


    if (ateFood) {

        score++;


        scoreText.textContent =
            score;


        createFood();


        speed =
            Math.max(
                65,
                150 - score * 4
            );


        clearInterval(timer);


        timer =
            setInterval(
                updateGame,
                speed
            );

    }

    else {

        snake.pop();

    }


    draw();

}


/* ==================================================
   DRAW
================================================== */

function draw() {

    if (!canvas.width) return;


    /* BACKGROUND */

    ctx.fillStyle =
        "#ffffff";


    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* GRID */

    ctx.strokeStyle =
        "rgba(40,50,40,0.06)";


    ctx.lineWidth =
        1;


    for (
        let i = 0;
        i <= GRID;
        i++
    ) {

        ctx.beginPath();

        ctx.moveTo(
            i * cellSize,
            0
        );

        ctx.lineTo(
            i * cellSize,
            canvas.height
        );

        ctx.stroke();


        ctx.beginPath();

        ctx.moveTo(
            0,
            i * cellSize
        );

        ctx.lineTo(
            canvas.width,
            i * cellSize
        );

        ctx.stroke();

    }


    /* ==================================================
       RISOL
    ================================================== */

    if (food) {

        const size =
            cellSize *
            RISOL_SIZE;


        const x =
            food.x *
            cellSize;


        const y =
            food.y *
            cellSize;


        if (

            food.image &&
            food.image.complete &&
            food.image.naturalWidth > 0

        ) {

            ctx.drawImage(

                food.image,

                x,
                y,

                size,
                size

            );

        }

        else {

            ctx.font =
                `${cellSize * 0.9}px Arial`;


            ctx.textAlign =
                "center";


            ctx.textBaseline =
                "middle";


            ctx.fillText(

                "🥟",

                x + size / 2,

                y + size / 2

            );

        }

    }


    /* ==================================================
       SNAKE
    ================================================== */

    for (
        let i = 0;
        i < snake.length;
        i++
    ) {

        const part =
            snake[i];


        const size =
            cellSize *
            SNAKE_SIZE;


        const x =
            part.x *
            cellSize;


        const y =
            part.y *
            cellSize;


        if (i === 0) {

            ctx.fillStyle =
                "#172b1b";

        }

        else {

            ctx.fillStyle =
                "#3f7048";

        }


        ctx.fillRect(

            x,
            y,
            size,
            size

        );


        ctx.strokeStyle =
            "#ffffff";


        ctx.lineWidth =
            1;


        ctx.strokeRect(

            x,
            y,
            size,
            size

        );


        if (i === 0) {

            drawEyes(
                x,
                y,
                size
            );

        }

    }

}


/* ==================================================
   EYES
================================================== */

function drawEyes(
    x,
    y,
    size
) {

    ctx.fillStyle =
        "#ffffff";


    const eyeSize =
        Math.max(
            2,
            cellSize * 0.11
        );


    let eye1;

    let eye2;


    if (direction.x === 1) {

        eye1 = [

            x + size * 0.72,
            y + size * 0.28

        ];

        eye2 = [

            x + size * 0.72,
            y + size * 0.72

        ];

    }

    else if (
        direction.x === -1
    ) {

        eye1 = [

            x + size * 0.28,
            y + size * 0.28

        ];

        eye2 = [

            x + size * 0.28,
            y + size * 0.72

        ];

    }

    else if (
        direction.y === -1
    ) {

        eye1 = [

            x + size * 0.28,
            y + size * 0.28

        ];

        eye2 = [

            x + size * 0.72,
            y + size * 0.28

        ];

    }

    else {

        eye1 = [

            x + size * 0.28,
            y + size * 0.72

        ];

        eye2 = [

            x + size * 0.72,
            y + size * 0.72

        ];

    }


    ctx.beginPath();

    ctx.arc(

        eye1[0],
        eye1[1],
        eyeSize,
        0,
        Math.PI * 2

    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(

        eye2[0],
        eye2[1],
        eyeSize,
        0,
        Math.PI * 2

    );

    ctx.fill();

}


/* ==================================================
   SAVE SCORE TO FIREBASE
================================================== */

async function saveScore() {

    if (score <= 0) return;


    try {

        const leaderboardRef =
            ref(
                database,
                "leaderboard"
            );


        await push(

            leaderboardRef,

            {

                name:
                    playerName ||
                    "Anonymous",

                score:
                    score,

                createdAt:
                    serverTimestamp()

            }

        );

        console.log(
            "Score saved:",
            score
        );

    }

    catch (error) {

        console.error(
            "Failed to save score:",
            error
        );

    }

}


/* ==================================================
   LOAD GLOBAL LEADERBOARD
================================================== */

function loadLeaderboard() {

    const leaderboardRef =
        ref(
            database,
            "leaderboard"
        );


    const topScoresQuery =
        query(

            leaderboardRef,

            orderByChild("score"),

            limitToLast(10)

        );


    onValue(

        topScoresQuery,

        snapshot => {

            const scores = [];


            snapshot.forEach(
                child => {

                    const data =
                        child.val();


                    scores.push({

                        name:
                            data.name ||
                            "Anonymous",

                        score:
                            Number(
                                data.score
                            )

                    });

                }
            );


            /*
               Firebase mengembalikan
               dari score kecil ke besar.

               Kita balik supaya
               tertinggi berada di atas.
            */

            scores.reverse();


            renderLeaderboard(
                homeLeaderboard,
                scores
            );


            renderLeaderboard(
                gameOverLeaderboard,
                scores
            );

        },

        error => {

            console.error(
                "Leaderboard error:",
                error
            );


            homeLeaderboard.innerHTML =
                `<div class="loading">
                    Leaderboard unavailable
                </div>`;

        }

    );

}


/* ==================================================
   RENDER LEADERBOARD
================================================== */

function renderLeaderboard(
    container,
    scores
) {

    if (!scores.length) {

        container.innerHTML =

            `<div class="loading">
                Belum ada skor. Jadilah yang pertama! 🥟
            </div>`;

        return;

    }


    container.innerHTML = "";


    scores.forEach(
        (item, index) => {

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "leaderboard-row";


            const rank =
                document.createElement(
                    "div"
                );


            rank.className =
                "rank";


            if (index === 0) {

                rank.textContent =
                    "🥇";

            }

            else if (index === 1) {

                rank.textContent =
                    "🥈";

            }

            else if (index === 2) {

                rank.textContent =
                    "🥉";

            }

            else {

                rank.textContent =
                    `${index + 1}.`;

            }


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "player-name";


            name.textContent =
                item.name;


            const score =
                document.createElement(
                    "div"
                );


            score.className =
                "player-score";


            score.textContent =
                item.score;


            row.appendChild(
                rank
            );

            row.appendChild(
                name
            );

            row.appendChild(
                score
            );


            container.appendChild(
                row
            );

        }
    );

}


/* ==================================================
   GAME OVER
================================================== */

async function endGame() {

    if (!running) return;


    running = false;


    clearInterval(timer);


    finalScore.textContent =
        score;


    /*
       Simpan skor ke Firebase.
    */

    await saveScore();


    gameScreen.classList.add(
        "hidden"
    );


    gameOverScreen.classList.remove(
        "hidden"
    );

}


/* ==================================================
   KEYBOARD
================================================== */

document.addEventListener(

    "keydown",

    function(event) {


        if (

            event.key === "ArrowUp" &&

            direction.y !== 1

        ) {

            nextDirection = {

                x: 0,
                y: -1

            };

        }


        else if (

            event.key === "ArrowDown" &&

            direction.y !== -1

        ) {

            nextDirection = {

                x: 0,
                y: 1

            };

        }


        else if (

            event.key === "ArrowLeft" &&

            direction.x !== 1

        ) {

            nextDirection = {

                x: -1,
                y: 0

            };

        }


        else if (

            event.key === "ArrowRight" &&

            direction.x !== -1

        ) {

            nextDirection = {

                x: 1,
                y: 0

            };

        }

    }

);


/* ==================================================
   MOBILE SWIPE
================================================== */

let touchStartX = 0;

let touchStartY = 0;


canvas.addEventListener(

    "touchstart",

    function(event) {

        const touch =
            event.changedTouches[0];


        touchStartX =
            touch.clientX;


        touchStartY =
            touch.clientY;

    },

    {
        passive: true
    }

);


canvas.addEventListener(

    "touchend",

    function(event) {

        const touch =
            event.changedTouches[0];


        const dx =
            touch.clientX -
            touchStartX;


        const dy =
            touch.clientY -
            touchStartY;


        if (

            Math.max(

                Math.abs(dx),

                Math.abs(dy)

            ) < 20

        ) {

            return;

        }


        if (

            Math.abs(dx) >
            Math.abs(dy)

        ) {


            if (

                dx > 0 &&

                direction.x !== -1

            ) {

                nextDirection = {

                    x: 1,
                    y: 0

                };

            }


            else if (

                dx < 0 &&

                direction.x !== 1

            ) {

                nextDirection = {

                    x: -1,
                    y: 0

                };

            }

        }


        else {


            if (

                dy > 0 &&

                direction.y !== -1

            ) {

                nextDirection = {

                    x: 0,
                    y: 1

                };

            }


            else if (

                dy < 0 &&

                direction.y !== 1

            ) {

                nextDirection = {

                    x: 0,
                    y: -1

                };

            }

        }

    },

    {
        passive: true
    }

);


/* ==================================================
   BUTTONS
================================================== */

document
    .getElementById(
        "playButton"
    )
    .addEventListener(
        "click",
        startGame
    );


document
    .getElementById(
        "againButton"
    )
    .addEventListener(
        "click",
        startGame
    );


document
    .getElementById(
        "homeButton"
    )
    .addEventListener(

        "click",

        function() {

            running = false;

            clearInterval(timer);


            gameScreen.classList.add(
                "hidden"
            );


            homeScreen.classList.remove(
                "hidden"
            );

        }

    );


document
    .getElementById(
        "backButton"
    )
    .addEventListener(

        "click",

        function() {

            gameOverScreen.classList.add(
                "hidden"
            );


            homeScreen.classList.remove(
                "hidden"
            );

        }

    );


/* ==================================================
   INITIALIZE
================================================== */

resizeCanvas();

loadLeaderboard();


</script>
